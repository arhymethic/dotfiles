general {
    lock_cmd = pidof hyprlock || hyprlock       # avoid starting multiple hyprlock instances.
    before_sleep_cmd = loginctl lock-session    # lock before suspend.
    after_sleep_cmd = hyprctl dispatch dpms on  # to avoid having to press a key twice to turn on the display.
}

# Dim display after 4 minutes (240s)
listener {
    timeout = 240
    on-timeout = ~/.config/hypr/scripts/idle_guard.sh brightnessctl -s set 10
    on-resume = brightnessctl -r
}

# Turn off display after 5 minutes (300s)
listener {
    timeout = 300
    on-timeout = ~/.config/hypr/scripts/idle_guard.sh hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# Suspend after 10 minutes (600s)
listener {
    timeout = 600
    on-timeout = ~/.config/hypr/scripts/idle_guard.sh systemctl suspend
}