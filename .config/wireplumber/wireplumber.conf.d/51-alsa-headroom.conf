# Increase ALSA hardware buffer headroom and period size to prevent underruns under load
monitor.alsa.rules = [
  {
    matches = [
      {
        node.name = "~alsa_input.pci.*"
      }
      {
        node.name = "~alsa_output.pci.*"
      }
    ]
    actions = {
      update-props = {
        api.alsa.period-size   = 1024
        api.alsa.headroom      = 1024
      }
    }
  }
]
